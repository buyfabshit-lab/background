<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Background removal</title>
    <style>
      body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:24px}
      .preview{max-width:600px;max-height:480px;border:1px solid #ddd;padding:8px}
      #resultImg{max-width:600px;display:block;margin-top:12px}
      #downloadBtn{margin-top:8px}
      #error{color:#b00020}
    </style>
  </head>
  <body>
    <h1>Background removal</h1>
    <p>Upload an image (PNG/JPG/WEBP/GIF). The image is sent to a server route which calls the Hugging Face Space to remove the background. HF_TOKEN is never exposed to the browser.</p>

    <input id="file" type="file" accept="image/*" />
    <div>
      <img id="preview" class="preview" alt="preview" />
    </div>
    <div>
      <button id="remove">Remove background</button>
      <button id="downloadBtn" style="display:none">Download result</button>
    </div>
    <div id="status"></div>
    <div id="error"></div>
    <img id="resultImg" alt="result" />

    <script src="/app.js"></script>
  </body>
</html>
